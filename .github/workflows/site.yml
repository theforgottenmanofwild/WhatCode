name: Website

# Publishes site/ (with the docs from docs/, a copy of the GitHub Discussions for the Forums pages and a copy of the
# code and its history for the Source pages) to GitHub Pages.
# The discussions are copied at build time, so the site is built again whenever a discussion or comment changes,
# and every six hours to pick up reactions and upvotes, which GitHub sends no event for.
# The Source pages show the whole repository, so every push to main publishes the site again.
on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          # The Source pages show the commit history and tags, so they need all of it, not just the newest commit.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Writes public/source-data/ from this checkout's git history. Needs no token.
      - run: npm run source
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
      # The smoke test renders the Source pages with the snapshot just written.
      - run: npm run smoke
      # Writes public/discussions.json. If GitHub cannot be reached this fails, and the site stays as it was.
      - run: npm run discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tells the build where the site is published, for the full addresses a link preview needs.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          # The pages have real addresses, so the build needs to know where the site is served from:
          # /name/ for a project site, / for a user site (owner.github.io).
          VITE_BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # The full address of the site (https://owner.github.io/name). Every page gets its own title, description and
          # picture for the embed a link shows in Discord and other chats; og:url and og:image need it.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
