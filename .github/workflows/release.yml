name: Stable release

# Manual only: Actions tab > Stable release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0 (becomes tag v0.2.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (leave empty to generate them from merged changes)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Stable releases come from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
        id: check

      - uses: ./.github/actions/build-apk
        with:
          version-name: ${{ inputs.version }}
          version-code: ${{ steps.check.outputs.code }}
          apk-name: WhatCodeEditor.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -n "$NOTES" ]; then
            notes_args=(--notes "$NOTES")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "v$VERSION" \
            build/WhatCodeEditor.apk \
            build/WhatCodeEditor.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "WhatCodeEditor $VERSION" \
            --latest \
            "${notes_args[@]}"
